version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # typescript-eslint does not support TypeScript 7 yet, and
      # packages/bridge/scripts/build.mjs resolves typescript/bin/tsc,
      # which TypeScript 7 no longer exports. Remove this rule and do
      # the upgrade as its own change once typescript-eslint supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # Don't let the Node types run ahead of the Node versions we support
      # (CI packages and runs on Node 20), or the compiler will accept APIs
      # that are missing there.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
